<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101821">
<title>灰燼誓約：失落王冠｜第三人稱 3D 重製版</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1118;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,#02070bb8 100%)}
#hud{position:fixed;inset:0;pointer-events:none;color:#f4e6c6;text-shadow:0 2px 5px #000}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.panel{background:linear-gradient(135deg,#101b23eF,#202b30d9);border:1px solid #c9a96b88;border-radius:13px;padding:9px 12px;backdrop-filter:blur(10px);box-shadow:0 6px 24px #0008}
.stats{min-width:145px}.brand{font:800 15px Georgia,serif;letter-spacing:.13em;color:#f1d69a}.small{font-size:11px;color:#d6cbb6;margin-top:3px}
.bar{height:7px;background:#462b2c;border-radius:8px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9f3032,#e97858);transition:width .2s}
.objective{font-size:11px;line-height:1.5;text-align:right;max-width:52%}.objective b{color:#f3d69a}.objective span{display:block;color:#ddd1bd}
#message{position:absolute;top:21%;left:50%;transform:translateX(-50%);font:700 clamp(18px,4vw,27px) Georgia,serif;letter-spacing:.08em;color:#ffe6ad;white-space:nowrap;opacity:0;transition:opacity .25s;text-align:center}#message.show{opacity:1}
#controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 13px);height:150px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 17px;pointer-events:none}
#stickArea{width:128px;height:128px;border:1px solid #e4d09b88;border-radius:50%;background:radial-gradient(circle,#26333b99,#101a21d9);box-shadow:inset 0 0 22px #0009,0 5px 18px #0008;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 32% 28%,#ead7a6,#806b48 75%);border:2px solid #f0dba6;box-shadow:0 4px 13px #000a}
.actions{display:flex;gap:9px;align-items:flex-end;pointer-events:auto}
.act{width:66px;height:66px;border-radius:50%;border:1px solid #dfc78d99;background:linear-gradient(145deg,#35454eF2,#111b22F2);color:#f7e8c6;font-weight:800;font-size:13px;box-shadow:0 5px 15px #0009;touch-action:none}
.act.primary{width:76px;height:76px;background:linear-gradient(145deg,#a66e3d,#492b25);border:2px solid #ebc77d;font-size:15px}
.act.active{filter:brightness(1.35);transform:scale(.96)}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 155px);left:50%;transform:translateX(-50%);font-size:10px;color:#ded2bb;background:#101a21c9;padding:5px 10px;border-radius:20px;white-space:nowrap}
#start,#dead{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#071018a8,#071018ed)}
#dead{display:none}.modal{width:min(480px,100%);text-align:center;padding:26px 22px;border:1px solid #c6a568;border-radius:22px;background:linear-gradient(145deg,#293840,#111a20);box-shadow:0 20px 70px #000c}
.modal h1{font:800 clamp(27px,7vw,40px) Georgia,serif;color:#f0d391;letter-spacing:.12em;margin:0 0 10px}
.modal p{color:#e0d7c7;line-height:1.75;font-size:14px}.gold{border:0;border-radius:12px;background:linear-gradient(135deg,#dfbf79,#936638);color:#1b1711;font-weight:900;font-size:17px;padding:14px 28px;margin-top:8px}
.note{font-size:11px!important;color:#aaa18f!important}
@media(orientation:landscape){#controls{height:125px}.act{width:61px;height:61px}.act.primary{width:71px;height:71px}#stickArea{width:112px;height:112px}#hint{bottom:calc(env(safe-area-inset-bottom) + 132px)}}
</style>
</head>
<body>
<div id="game"></div><div id="vignette"></div>
<div id="hud">
 <div id="top">
  <div class="panel stats"><div class="brand">灰燼誓約</div><div class="small">誓約騎士・艾德里克</div><div class="bar"><i id="hpbar"></i></div><div class="small" id="hptext">生命 100 / 100</div></div>
  <div class="panel objective"><b>第一章・灰燼森林</b><span id="quest">尋回王室徽記：0 / 3</span><span id="enemies">威脅：森林墮落者</span></div>
 </div>
 <div id="message"></div>
 <div id="controls">
  <div id="stickArea"><div id="stick"></div></div>
  <div class="actions"><button class="act" id="roll">翻滾</button><button class="act" id="guard">防禦</button><button class="act primary" id="attack">斬擊</button></div>
 </div>
 <div id="hint">左側搖桿移動・右側戰鬥｜鏡頭跟隨角色方向</div>
</div>
<div id="start"><div class="modal"><h1>灰燼誓約</h1><p>王國陷落的第七年，古堡深處傳來鐘聲。<br>你是最後的誓約騎士，穿越灰燼森林，尋回三枚王室徽記，擊敗守門的墮落騎士，奪回失落王冠。</p><p>左側搖桿控制前後左右，右側按鈕可斬擊、格擋與翻滾。靠近金色徽記即可收集。</p><button class="gold" id="begin">踏入灰燼森林</button><p class="note">iPhone 觸控版・建議橫向遊玩</p></div></div>
<div id="dead"><div class="modal"><h1 id="endtitle">誓約未竟</h1><p id="endtext">騎士倒下了，但誓約仍在等待。</p><button class="gold" id="retry">再次啟程</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game');
let scene,camera,renderer,clock,player,weapon,hp=100,got=0,started=false,dead=false;
let enemies=[],sigils=[],move={x:0,y:0},keys={},attackTime=0,rollTime=0,invuln=0,guard=false,msgTime=0,boss;
const mat=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={steel:mat(0x9ba9ae,.27,.82),bright:mat(0xd0d8d8,.2,.9),dark:mat(0x26343b,.48,.5),gold:mat(0xc9a15e,.28,.78),red:mat(0x632d31,.8),leather:mat(0x38271f),bark:mat(0x382b25),leaf:mat(0x263d37),leaf2:mat(0x405647),stone:mat(0x596267),enemy:mat(0x4b292c,.48,.35),glow:new THREE.MeshBasicMaterial({color:0xffd47b})};
function mesh(g,m,x=0,y=0,z=0,p=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function box(w,h,d,m,x,y,z,p=scene){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p)}
function ball(r,m,x,y,z,p=scene){return mesh(new THREE.SphereGeometry(r,20,16),m,x,y,z,p)}
function cyl(a,b,h,m,x,y,z,p=scene,n=12){return mesh(new THREE.CylinderGeometry(a,b,h,n),m,x,y,z,p)}
function capsule(r,l,m,x,y,z,p=scene){return mesh(new THREE.CapsuleGeometry(r,l,5,12),m,x,y,z,p)}
function message(t){const el=document.querySelector('#message');el.textContent=t;el.classList.add('show');msgTime=2.3}
function makeKnight(){
 const g=new THREE.Group();scene.add(g);g.position.set(0,0,5);player=g;
 // Layered plate armor, shoulder pauldrons, articulated limbs and a long crimson surcoat.
 const cape=mesh(new THREE.BoxGeometry(.72,1.22,.08),M.red,0,1.02,.19,g);cape.rotation.x=-.08;cape.rotation.z=.025;
 const torso=capsule(.31,.55,M.steel,0,1.38,0,g);torso.scale.set(1.13,1,.82);
 const breast=mesh(new THREE.SphereGeometry(.34,20,14),M.bright,0,1.48,-.19,g);breast.scale.set(1,.86,.43);
 box(.045,.56,.025,M.gold,0,1.42,-.34,g);
 for(let y of [1.24,1.43,1.62])for(let x of [-.19,.19])ball(.025,M.gold,x,y,-.31,g);
 cyl(.29,.34,.15,M.dark,0,1.79,0,g,12);
 // Helmet silhouette, brow, visor slit and crest
 ball(.22,M.dark,0,1.99,0,g);const helm=cyl(.24,.28,.42,M.bright,0,2.13,0,g,10);helm.scale.z=.88;
 const dome=mesh(new THREE.SphereGeometry(.25,16,10,0,Math.PI*2,0,Math.PI*.56),M.steel,0,2.23,0,g);dome.scale.set(1,.7,.9);
 box(.34,.075,.055,M.dark,0,2.12,-.235,g);box(.25,.025,.025,M.red,0,2.105,-.27,g);
 const crest=mesh(new THREE.ConeGeometry(.07,.27,5),M.red,0,2.47,0,g);crest.rotation.z=.04;
 for(const s of [-1,1]){
  const shoulder=ball(.235,M.bright,s*.46,1.7,0,g);shoulder.scale.set(1.15,.8,1);
  const pauldron=mesh(new THREE.TorusGeometry(.18,.025,8,14),M.gold,s*.46,1.7,-.04,g);pauldron.scale.set(1.15,.85,1);
  const arm=capsule(.125,.42,M.steel,s*.49,1.35,0,g);arm.rotation.z=s*-.12;
  const fore=capsule(.12,.34,M.dark,s*.55,.99,-.02,g);fore.rotation.z=s*.08;
  ball(.13,M.bright,s*.56,.77,-.02,g);
  capsule(.15,.43,M.dark,s*.19,.49,0,g);
  ball(.15,M.bright,s*.19,.43,-.12,g).scale.set(1,.8,.45);
  box(.24,.32,.13,M.steel,s*.19,.23,-.1,g);
  box(.3,.16,.43,M.leather,s*.19,.1,-.04,g);
 }
 // sword and shield
 weapon=new THREE.Group();weapon.position.set(.62,1.08,-.17);g.add(weapon);
 cyl(.045,.05,.36,M.leather,0,-.12,0,weapon,10).rotation.z=.08;
 box(.42,.065,.09,M.gold,0,.1,0,weapon);
 const blade=box(.11,.9,.045,M.bright,0,.6,0,weapon);blade.rotation.z=-.025;
 box(.018,.73,.012,M.dark,0,.6,-.03,weapon);
 const tip=mesh(new THREE.ConeGeometry(.075,.2,4),M.bright,0,1.15,0,weapon);tip.rotation.z=Math.PI;
 const shield=mesh(new THREE.CylinderGeometry(.34,.27,.12,6),M.red,-.61,1.2,-.04,g);shield.rotation.z=Math.PI/2;shield.scale.set(.8,1.12,.6);
 const rim=mesh(new THREE.TorusGeometry(.29,.025,7,6),M.gold,-.61,1.2,-.12,g);rim.scale.set(.85,1.1,1);
 const crest2=mesh(new THREE.OctahedronGeometry(.13),M.gold,-.61,1.22,-.17,g);crest2.scale.y=1.3;
 return g;
}
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);cyl(.2,.3,2.7,M.bark,0,1.35,0,g);for(let i=0;i<4;i++)mesh(new THREE.ConeGeometry(1.05-i*.16,1.85,7),i%2?M.leaf:M.leaf2,0,2+i*.43,0,g);return g}
function ruin(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);for(let i=0;i<3;i++)box(.55,2.8-i*.25,.65,M.stone,(i-1)*.65,1.4,0,g);box(2.5,.35,.8,M.stone,0,2.9,0,g)}
function sigil(x,z){const g=new THREE.Group();g.position.set(x,.9,z);scene.add(g);const ring=mesh(new THREE.TorusGeometry(.34,.055,8,24),M.gold,0,0,0,g);ring.rotation.x=Math.PI/2;mesh(new THREE.OctahedronGeometry(.2),M.glow,0,.06,0,g);const l=new THREE.PointLight(0xffc86a,1.5,5);l.position.y=.4;g.add(l);sigils.push(g)}
function enemy(x,z,big=false){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(big?1.35:1);scene.add(g);capsule(.28,.55,M.enemy,0,1.15,0,g);ball(.2,M.dark,0,1.83,0,g);cyl(.22,.25,.3,M.dark,0,1.95,0,g,8);for(const s of [-1,1]){capsule(.12,.38,M.dark,s*.38,1.3,0,g);capsule(.14,.4,M.dark,s*.16,.45,0,g)}box(.08,.8,.05,M.bright,.42,1.1,-.05,g);return{group:g,hp:big?10:3,big,cd:0,dead:false}}
function setup(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x9aa9a7);scene.fog=new THREE.FogExp2(0x87958e,.026);
 camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,150);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;root.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xdce9ee,0x26302a,1.9));const sun=new THREE.DirectionalLight(0xffdfad,2.5);sun.position.set(-8,16,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);
 const ground=mesh(new THREE.PlaneGeometry(100,100),mat(0x35443c),0,0,0);ground.rotation.x=-Math.PI/2;
 const path=mesh(new THREE.PlaneGeometry(7,75),mat(0x625a4c),0,.015,-20);path.rotation.x=-Math.PI/2;
 for(let i=0;i<58;i++){const z=12-i*1.1,side=i%2?1:-1,x=side*(5+Math.random()*7);tree(x,z,.8+Math.random()*.75);if(i%4===0){const rock=ball(.6+Math.random()*.55,M.stone,x*.72,.38,z+1);rock.scale.y=.58}}
 ruin(-7,-13);ruin(7,-31);ruin(-5,-48);
 makeKnight();sigil(-3,-7);sigil(3,-23);sigil(-2,-39);
 enemies.push(enemy(2,-13),enemy(-3,-29),enemy(2,-42));boss=enemy(0,-54,true);enemies.push(boss);
 clock=new THREE.Clock();addEventListener('resize',resize);
}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function hud(){document.querySelector('#hpbar').style.width=Math.max(0,hp)+'%';document.querySelector('#hptext').textContent=`生命 ${Math.max(0,Math.ceil(hp))} / 100`;document.querySelector('#quest').textContent=`尋回王室徽記：${got} / 3`;document.querySelector('#enemies').textContent=got===3?'守門者已甦醒':'威脅：森林墮落者'}
function damage(n){if(invuln>0||guard||dead)return;hp-=n;hud();if(hp<=0){dead=true;document.querySelector('#dead').style.display='flex'}}
function hit(e){if(e.dead)return;e.hp--;if(e.hp<=0){e.dead=true;scene.remove(e.group);if(e.big){document.querySelector('#endtitle').textContent='王冠歸來';document.querySelector('#endtext').textContent='三枚徽記重聚，墮落守門者已被擊敗。王國的鐘聲再次響起。';setTimeout(()=>document.querySelector('#dead').style.display='flex',1200)}}}
function attack(){if(!started||dead||attackTime>0||rollTime>0)return;attackTime=.48;const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);for(const e of enemies){if(e.dead||e.big&&got<3)continue;const d=e.group.position.clone().sub(player.position);if(d.length()<2.7&&d.normalize().dot(f)>.05)hit(e)}}
function roll(){if(!started||dead||rollTime>0)return;rollTime=.58;invuln=.68}
function update(dt,t){
 if(!started||dead)return;attackTime=Math.max(0,attackTime-dt);rollTime=Math.max(0,rollTime-dt);invuln=Math.max(0,invuln-dt);
 if(msgTime>0&&((msgTime-=dt)<=0))document.querySelector('#message').classList.remove('show');
 let sx=move.x+(keys.KeyD?1:0)-(keys.KeyA?1:0),sy=move.y+(keys.KeyW?1:0)-(keys.KeyS?1:0),len=Math.hypot(sx,sy);if(len>1){sx/=len;sy/=len}
 // Camera-relative movement: joystick up follows camera forward, left/right follow camera right.
 const camForward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),cameraYaw);
 const camRight=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),cameraYaw);
 const dir=camRight.multiplyScalar(sx).add(camForward.multiplyScalar(sy));if(dir.lengthSq()>1)dir.normalize();
 const moving=len>.08,speed=rollTime>0?8:guard?1.35:4.8;
 if(moving){player.position.addScaledVector(dir,speed*dt);const target=Math.atan2(dir.x,-dir.z);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,target,Math.min(1,dt*12))}
 if(rollTime>0){const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);player.position.addScaledVector(f,7.5*dt)}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-9,9);player.position.z=THREE.MathUtils.clamp(player.position.z,-58,11);
 weapon.rotation.z=attackTime>0?THREE.MathUtils.lerp(weapon.rotation.z,1.35,dt*18):THREE.MathUtils.damp(weapon.rotation.z,0,11,dt);
 for(const s of sigils){if(s.userData.got)continue;s.rotation.y+=dt*.8;s.position.y=.9+Math.sin(t*2)*.13;if(s.position.distanceTo(player.position)<1.55){s.userData.got=true;scene.remove(s);got++;message(got===3?'三枚徽記齊聚・守門者甦醒！':'王室徽記已取得');hud()}}
 for(const e of enemies){if(e.dead||e.big&&got<3)continue;const d=player.position.clone().sub(e.group.position),dist=d.length();if(dist<11&&dist>1.35){d.y=0;d.normalize();e.group.position.addScaledVector(d,dt*(e.big?1.35:1.15));e.group.rotation.y=Math.atan2(d.x,d.z)}if(dist<1.85){e.cd-=dt;if(e.cd<=0){damage(e.big?17:8);e.cd=e.big?1.55:1.8}}}
 // Smooth third-person camera, fixed behind the character's facing direction.
 const behind=new THREE.Vector3(0,4.1,7.2).applyQuaternion(player.quaternion).add(player.position);camera.position.lerp(behind,1-Math.exp(-5.5*dt));const look=player.position.clone().add(new THREE.Vector3(0,1.35,-.7).applyQuaternion(player.quaternion));camera.lookAt(look);
}
let cameraYaw=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);update(dt,clock.elapsedTime);renderer.render(scene,camera)}
// One active pointer for the joystick; pointer capture prevents touch drift and stuck movement.
const area=document.querySelector('#stickArea'),knob=document.querySelector('#stick');let stickPointer=null;
function setStick(x,y){const r=area.getBoundingClientRect(),dx0=x-(r.left+r.width/2),dy0=y-(r.top+r.height/2),max=r.width*.34,l=Math.hypot(dx0,dy0),k=l>max?max/l:1,dx=dx0*k,dy=dy0*k;move.x=dx/max;move.y=-dy/max;if(Math.hypot(move.x,move.y)<.08)move={x:0,y:0};knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
function resetStick(){stickPointer=null;move.x=0;move.y=0;knob.style.transform='translate(-50%,-50%)'}
area.addEventListener('pointerdown',e=>{e.preventDefault();if(stickPointer!==null)return;stickPointer=e.pointerId;area.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY)});
area.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();setStick(e.clientX,e.clientY)}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])area.addEventListener(ev,e=>{if(stickPointer===null||e.pointerId===stickPointer)resetStick()});
function bindButton(id,down,up){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch{}down()});const release=e=>{b.classList.remove('active');up()};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)}
bindButton('attack',attack,()=>{});bindButton('roll',roll,()=>{});bindButton('guard',()=>guard=true,()=>guard=false);
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')attack();if(e.code==='ShiftLeft')roll()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelector('#begin').onclick=()=>{document.querySelector('#start').style.display='none';started=true;message('探索灰燼森林・尋回三枚徽記')};
document.querySelector('#retry').onclick=()=>location.reload();
setup();hud();loop();
</script>
</body></html>
