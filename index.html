<body><div id="game"></div><div id="vignette"></div>
<div id="hud"><div id="top"><div class="panel stats"><div class="brand">灰燼誓約</div><div class="small">誓約騎士・艾德里克</div><div class="bar"><i id="hpbar"></i></div><div class="small" id="hptext">生命 100 / 100</div></div><div class="panel objective"><b>第一章・灰燼森林</b><span id="quest">尋回王室徽記：0 / 3</span><span id="enemies">威脅：森林墮落者</span></div></div><div id="message"></div><div id="controls"><div class="stick-wrap" id="stickArea"><div class="stick" id="stick"></div></div><div class="actions"><button class="act" id="roll">翻滾</button><button class="act" id="guard">防禦</button><button class="act primary" id="attack">斬擊</button></div></div><div id="hint">左側移動・右側斬擊／防禦／翻滾</div><div id="rotate">建議橫向遊玩</div></div>
<div id="start"><div class="modal"><h1>灰燼誓約</h1><p>王國陷落的第七年，古堡深處傳來鐘聲。<br>你是最後的誓約騎士，穿越灰燼森林，尋回三枚王室徽記，擊敗守門的墮落騎士，奪回失落王冠。</p><p>以左側搖桿移動，右側按鈕戰鬥。靠近金色徽記即可收集。</p><button class="gold" id="begin">踏入灰燼森林</button><p class="note">3D 手機試玩版・建議使用橫向畫面</p></div></div>

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game');
let scene,camera,renderer,clock,player,weapon,shield,enemies=[],sigils=[],particles=[],hp=100,sigilsGot=0,started=false,dead=false,boss=null,attackTimer=0,rollTimer=0,guard=false,invuln=0,move={x:0,y:0},keys={},msgTimer=0;
const mat=(c,rough=.8,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});

function mesh(g,m,x=0,y=0,z=0,parent=scene){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(w,h,d,m,x,y,z,p=scene){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p)}
function sphere(r,m,x,y,z,p=scene){return mesh(new THREE.SphereGeometry(r,16,12),m,x,y,z,p)}
function cyl(rt,rb,h,m,x,y,z,p=scene,n=12){return mesh(new THREE.CylinderGeometry(rt,rb,h,n),m,x,y,z,p)}
function showMessage(t){let el=document.querySelector('#message');el.textContent=t;el.classList.add('show');msgTimer=2.2}
function makeKnight(){
 let g=new THREE.Group();scene.add(g);g.position.set(0,0,4);player=g;
 const darkSteel=mat(0x59666c,.28,.82), edgeGold=mat(0xd0ad68,.3,.72), cloth=mat(0x542a2d,.92,0), leather2=mat(0x30231e,.86,0), visorMat=mat(0x111a20,.38,.55);
 // Heavy, layered oath-knight cuirass and a split crimson mantle
 let capeShape=new THREE.Shape();capeShape.moveTo(-.25,1.78);capeShape.quadraticCurveTo(-.43,1.35,-.48,.52);capeShape.lineTo(-.16,.28);capeShape.lineTo(.38,.48);capeShape.quadraticCurveTo(.3,1.35,.25,1.78);capeShape.closePath();
 let cape=mesh(new THREE.ShapeGeometry(capeShape),cloth,0,0,.16,g);cape.material.side=THREE.DoubleSide;cape.rotation.x=.035;
 let torso=mesh(new THREE.CapsuleGeometry(.34,.62,5,12),M.armor,0,1.35,0,g);torso.scale.set(1,.98,.78);
 let gorget=mesh(new THREE.CylinderGeometry(.29,.35,.16,12),darkSteel,0,1.78,0,g);gorget.rotation.x=Math.PI/2;
 let chest=mesh(new THREE.BoxGeometry(.64,.5,.2),M.steel,0,1.45,-.105,g);chest.rotation.x=-.08;
 let breast=mesh(new THREE.CapsuleGeometry(.22,.25,3,8),M.armor,0,1.48,-.225,g);breast.scale.set(1.22,1,.25);
 box(.045,.42,.035,edgeGold,0,1.46,-.34,g);
 for(let y of [1.28,1.48,1.66])for(let x of [-.22,.22])sphere(.027,edgeGold,x,y,-.225,g);
 let tabard=mesh(new THREE.BoxGeometry(.43,.62,.07),M.red,0,1.0,.08,g);tabard.rotation.x=.04;
 let belt=box(.62,.1,.27,leather2,0,1.06,-.005,g);box(.16,.15,.05,edgeGold,0,1.06,-.16,g);
 // helmet, brow ridge, eye slit, cheek guards and crest
 sphere(.22,M.dark,0,1.98,0,g);let helm=cyl(.255,.29,.43,M.armor,0,2.12,0,g,10);helm.scale.z=.9;
 let crown=mesh(new THREE.SphereGeometry(.26,10,7,0,Math.PI*2,0,Math.PI*.55),M.steel,0,2.22,0,g);crown.scale.set(1,.68,.92);
 box(.34,.075,.055,darkSteel,0,2.12,-.245,g);box(.27,.035,.035,visorMat,0,2.105,-.278,g);
 for(let x of [-.19,.19]){let cheek=mesh(new THREE.BoxGeometry(.12,.28,.13),darkSteel,x,1.99,-.17,g);cheek.rotation.z=x<0?-.18:.18;}
 let nose=mesh(new THREE.ConeGeometry(.065,.18,4),M.steel,0,2.02,-.27,g);nose.rotation.x=-Math.PI/2;
 let crest=mesh(new THREE.ConeGeometry(.075,.3,5),M.red,0,2.47,0,g);crest.rotation.z=.05;
 // articulated arms with pauldrons, vambraces and gauntlets
 for(let s of [-1,1]){
  let upper=mesh(new THREE.CapsuleGeometry(.135,.42,4,9),M.armor,s*.47,1.43,0,g);upper.rotation.z=s*-.2;
  let elbow=sphere(.14,darkSteel,s*.54,1.17,-.015,g);
  let fore=mesh(new THREE.CapsuleGeometry(.125,.34,4,9),darkSteel,s*.57,.98,-.025,g);fore.rotation.z=s*.08;
  let cuff=mesh(new THREE.CylinderGeometry(.14,.14,.12,10),edgeGold,s*.57,.82,-.025,g);cuff.rotation.z=Math.PI/2;
  sphere(.13,M.armor,s*.58,.75,-.025,g);
  let sh=sphere(.245,M.steel,s*.47,1.72,0,g);sh.scale.set(1.12,.78,1.08);
  let shRim=mesh(new THREE.TorusGeometry(.19,.025,6,12),edgeGold,s*.47,1.72,-.015,g);shRim.scale.set(1.2,.8,1);shRim.rotation.y=Math.PI/2;
  // legs, knee cops, greaves and heavy boots
  mesh(new THREE.CapsuleGeometry(.16,.48,4,8),M.dark,s*.19,.48,0,g);
  let knee=sphere(.17,M.steel,s*.19,.48,-.13,g);knee.scale.set(1,.78,.48);
  box(.24,.34,.13,darkSteel,s*.19,.27,-.12,g);
  box(.3,.18,.48,M.leather,s*.19,.12,-.06,g);
  box(.31,.055,.1,edgeGold,s*.19,.34,-.19,g);
 }
 // sword: wrapped grip, crossguard, fuller and pointed steel blade
 weapon=new THREE.Group();weapon.position.set(.64,1.12,-.16);g.add(weapon);
 let h=cyl(.045,.052,.42,leather2,0,-.1,0,weapon);h.rotation.z=.08;
 for(let i=0;i<4;i++)box(.095,.025,.095,edgeGold,0,-.23+i*.08,0,weapon);
 box(.42,.065,.09,edgeGold,0,.13,0,weapon);
 let blade=mesh(new THREE.BoxGeometry(.105,.9,.045),M.steel,0,.62,0,weapon);blade.rotation.z=-.025;
 box(.018,.78,.012,darkSteel,0,.62,-.028,weapon);
 let tip=mesh(new THREE.ConeGeometry(.075,.22,4),M.steel,0,1.17,0,weapon);tip.rotation.z=Math.PI;
 // kite shield with metal rim and raised oath crest
 shield=mesh(new THREE.CylinderGeometry(.34,.27,.12,6),M.red,-.62,1.22,-.04,g);shield.rotation.z=Math.PI/2;shield.rotation.y=Math.PI/6;shield.scale.set(.82,1.1,.55);
 let rim=mesh(new THREE.TorusGeometry(.28,.025,6,6),edgeGold,-.62,1.22,-.12,g);rim.scale.set(.9,1.1,1);
 let emblem=mesh(new THREE.OctahedronGeometry(.14),M.gold,-.62,1.24,-.16,g);emblem.scale.set(1,1.25,.55);
 return g;
}
function tree(x,z,s=1){let g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);cyl(.22,.34,2.8,M.bark,0,1.4,0,g);for(let i=0;i<4;i++){let y=2+i*.48;let c=mesh(new THREE.ConeGeometry(1.15-i*.15,2.0,7),i%2?M.leaf:M.leaf2,0,y,0,g);c.position.y=y;}return g}
function ruin(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);for(let i=0;i<3;i++){box(.55,3.2-i*.35,.65,M.stone,(i-1)*.65,1.6,0,g)}box(2.5,.4,.8,M.stone,0,3.2,0,g);for(let i=0;i<3;i++){let col=cyl(.18,.22,2.4,M.stone,-.85+i*.85,1.2,-.5,g,8);}
}
function createSigil(x,z,i){let g=new THREE.Group();g.position.set(x,.9,z);scene.add(g);let ring=mesh(new THREE.TorusGeometry(.36,.07,8,24),M.gold,0,0,0,g);ring.rotation.x=Math.PI/2;let gem=mesh(new THREE.OctahedronGeometry(.22),M.glow,0,.06,0,g);let light=new THREE.PointLight(0xffc86a,1.5,5);light.position.y=.4;g.add(light);sigils.push({group:g,got:false,phase:i});}
function makeEnemy(x,z,big=false){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let scale=big?1.35:1;g.scale.setScalar(scale);let body=mesh(new THREE.CapsuleGeometry(.3,.58,4,8),M.enemy,0,1.15,0,g);let head=sphere(.23,M.dark,0,1.85,0,g);let helm=cyl(.25,.28,.34,M.dark,0,1.98,0,g,8);let eye1=sphere(.045,M.glow,-.1,1.85,-.2,g),eye2=sphere(.045,M.glow,.1,1.85,-.2,g);let sword=box(.1,.9,.06,M.steel,.45,1.15,-.05,g);sword.rotation.z=-.2;for(let s of [-1,1]){mesh(new THREE.CapsuleGeometry(.13,.4,3,6),M.dark,s*.4,1.35,0,g);mesh(new THREE.CapsuleGeometry(.15,.5,3,6),M.dark,s*.17,.48,0,g)}let hpbar=box(.7,.07,.05,M.red,0,2.35,0,g);return {group:g,hp:big?9:3,max:big?9:3,big,attack:0,bar:hpbar,dead:false};}
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x9aa9a7);scene.fog=new THREE.FogExp2(0x87958e,.027);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,150);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdce9ee,0x26302a,2.0));let sun=new THREE.DirectionalLight(0xffdfad,2.6);sun.position.set(-8,16,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);let fill=new THREE.DirectionalLight(0x91b9c9,.7);fill.position.set(8,8,-10);scene.add(fill);
let ground=mesh(new THREE.PlaneGeometry(100,100),mat(0x35443c),0,0,0);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
// path
let path=mesh(new THREE.PlaneGeometry(7,70),mat(0x625a4c),0,.012,-18);path.rotation.x=-Math.PI/2;
// rocks + trees corridor
for(let i=0;i<54;i++){let z=12-(i/54)*62;let side=i%2?1:-1;let x=side*(5+Math.random()*7);tree(x,z,.8+Math.random()*.8);if(i%4===0){let r=sphere(.7+Math.random()*.6,M.stone,x*.72,.45,z+1);r.scale.y=.6;}}
for(let i=0;i<10;i++){let x=(i%2?1:-1)*(4.8+Math.random()*1.4),z=8-i*5.5;tree(x,z,1.2)}
ruin(-7,-13);ruin(7,-31);ruin(-5,-48);
// distant towers
for(let s of [-1,1]){cyl(1,1.3,8,M.stone,s*16,4,-44,scene,8);}
makeKnight();createSigil(-3,-7,0);createSigil(3,-23,1);createSigil(-2,-39,2);
enemies.push(makeEnemy(2,-13),makeEnemy(-3,-29),makeEnemy(2,-42));boss=makeEnemy(0,-54,true);enemies.push(boss);
clock=new THREE.Clock();window.addEventListener('resize',resize);}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));}
function updateHUD(){document.querySelector('#hpbar').style.width=Math.max(0,hp)+'%';document.querySelector('#hptext').textContent='生命 '+Math.max(0,Math.ceil(hp))+' / 100';document.querySelector('#quest').textContent=`尋回王室徽記：${sigilsGot} / 3`;document.querySelector('#enemies').textContent=sigilsGot===3?'守門者已甦醒':'威脅：森林墮落者';}
function hitEnemy(e){if(e.dead)return;e.hp--;e.group.position.add(new THREE.Vector3(0,0,.18));if(e.hp<=0){e.dead=true;scene.remove(e.group);if(e.big){showMessage('守門者倒下了・王冠重歸誓約');document.querySelector('#endtitle').textContent='王冠歸來';document.querySelector('#endtext').textContent='三枚徽記重聚，墮落守門者已被擊敗。灰燼之中，王國的鐘聲再次響起。';setTimeout(()=>document.querySelector('#dead').style.display='flex',1500)}}}
function attack(){if(!started||dead||attackTimer>0||rollTimer>0)return;attackTimer=.42;weapon.rotation.z=-1.35;let forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);for(let e of enemies){if(e.dead)continue;let d=e.group.position.clone().sub(player.position);if(d.length()<2.6&&d.normalize().dot(forward)>.15)hitEnemy(e)}}
function doRoll(){if(!started||dead||rollTimer>0)return;rollTimer=.62;invuln=.7;}
function doGuard(v){guard=v}
function damage(n){if(invuln>0||guard||dead)return;hp-=n;updateHUD();if(hp<=0){dead=true;document.querySelector('#dead').style.display='flex';document.querySelector('#endtitle').textContent='誓約未竟';document.querySelector('#endtext').textContent='騎士倒下了。重新踏入森林，完成未竟的誓約。'}}
function update(dt,t){if(!started||dead)return;attackTimer=Math.max(0,attackTimer-dt);rollTimer=Math.max(0,rollTimer-dt);invuln=Math.max(0,invuln-dt);if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)document.querySelector('#message').classList.remove('show')}
let x=move.x+(keys.KeyD?1:0)-(keys.KeyA?1:0),y=move.y+(keys.KeyW?1:0)-(keys.KeyS?1:0);let len=Math.hypot(x,y);if(len>1){x/=len;y/=len}let moving=len>.08;let speed=rollTimer>0?8:guard?1.5:(len>.78?5.4:4.0);let forward=new THREE.Vector3(x,0,-y);if(moving){let angle=Math.atan2(forward.x,-forward.z);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,angle,Math.min(1,dt*10));player.position.addScaledVector(forward,speed*dt)}if(rollTimer>0){let f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);player.position.addScaledVector(f,8*dt);player.rotation.z=Math.sin((.62-rollTimer)*Math.PI)*.35}else player.rotation.z=THREE.MathUtils.damp(player.rotation.z,0,8,dt);
player.position.x=THREE.MathUtils.clamp(player.position.x,-9,9);player.position.z=THREE.MathUtils.clamp(player.position.z,-58,11);
if(attackTimer>0)weapon.rotation.z=THREE.MathUtils.lerp(weapon.rotation.z,1.4,dt*20);else weapon.rotation.z=THREE.MathUtils.damp(weapon.rotation.z,0,12,dt);
// sigils
for(let s of sigils){if(s.got)continue;s.group.rotation.y+=dt*.8;s.group.position.y=.9+Math.sin(t*2+s.phase)*.15;if(s.group.position.distanceTo(player.position)<1.5){s.got=true;scene.remove(s.group);sigilsGot++;showMessage('王室徽記已取得');updateHUD();if(sigilsGot===3)showMessage('三枚徽記齊聚・守門者甦醒！')}}
// enemy AI
for(let e of enemies){if(e.dead)continue;let d=player.position.clone().sub(e.group.position);let dist=d.length();if((!e.big||sigilsGot===3)&&dist<10&&dist>1.25){d.y=0;d.normalize();e.group.position.addScaledVector(d,dt*(e.big?1.45:1.15));e.group.rotation.y=Math.atan2(d.x,d.z)}if(dist<1.8){e.attack-=dt;if(e.attack<=0){damage(e.big?18:9);e.attack=e.big?1.6:1.9}}}
// camera follow behind
let desired=new THREE.Vector3(0,4.3,7.4).applyQuaternion(player.quaternion).add(player.position);camera.position.lerp(desired,1-Math.exp(-5*dt));let look=player.position.clone().add(new THREE.Vector3(0,1.3,-1.0).applyQuaternion(player.quaternion));camera.lookAt(look);
// light fog and animation
weapon.position.y=1.22+(moving?Math.sin(t*10)*.035:0);}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);let t=clock.elapsedTime;update(dt,t);if(renderer)renderer.render(scene,camera)}
// Robust iPhone virtual joystick: pointer capture, touch fallback, dead-zone and full reset
const area=document.querySelector('#stickArea'),knob=document.querySelector('#stick');let pointer=null;
function setStick(clientX,clientY){const r=area.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=Math.max(24,r.width*.36);let dx=clientX-cx,dy=clientY-cy,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max;l=max}let nx=dx/max,ny=-dy/max;if(Math.hypot(nx,ny)<.09){nx=0;ny=0}move.x=nx;move.y=ny;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}
function resetStick(){pointer=null;move.x=0;move.y=0;knob.style.transform='translate(-50%,-50%)'}
area.addEventListener('contextmenu',e=>e.preventDefault());
area.addEventListener('pointerdown',e=>{e.preventDefault();if(pointer!==null)return;pointer=e.pointerId;try{area.setPointerCapture(pointer)}catch(_){}setStick(e.clientX,e.clientY)});
area.addEventListener('pointermove',e=>{if(e.pointerId===pointer){e.preventDefault();setStick(e.clientX,e.clientY)}});
area.addEventListener('pointerup',e=>{if(e.pointerId===pointer)resetStick()});area.addEventListener('pointercancel',e=>{if(e.pointerId===pointer)resetStick()});area.addEventListener('lostpointercapture',resetStick);
// Safari fallback for older iOS web views without Pointer Events
if(!('PointerEvent' in window)){area.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];pointer=t.identifier;setStick(t.clientX,t.clientY)},{passive:false});area.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===pointer){e.preventDefault();setStick(t.clientX,t.clientY)}},{passive:false});area.addEventListener('touchend',resetStick,{passive:false});area.addEventListener('touchcancel',resetStick,{passive:false});}
function bindHold(id,down,up){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}down()});b.addEventListener('pointerup',e=>{e.preventDefault();up()});b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
bindHold('attack',attack,()=>{});bindHold('roll',doRoll,()=>{});bindHold('guard',()=>doGuard(true),()=>doGuard(false));window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')attack();if(e.code==='ShiftLeft')doRoll()});window.addEventListener('keyup',e=>keys[e.code]=false);
document.querySelector('#begin').onclick=()=>{document.querySelector('#start').style.display='none';started=true;showMessage('探索灰燼森林・尋回三枚徽記')};document.querySelector('#retry').onclick=()=>location.reload();
setup();updateHUD();loop();
</script></body></html>
